<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>환불 상담 그래프</title>

<!-- ══════════════════════════════════════════════════════════════════════
     1. 그래프 선언  ─ 화면보다 먼저 온다.
        앱의 모든 흐름은 아래 EDGES 배열 하나에 들어 있다.
     ══════════════════════════════════════════════════════════════════════ -->
<script>
'use strict';

/* ── 정책 상수 ──────────────────────────────────────────────────── */
var 승인한도 = 500000;      // 이 금액을 넘으면 상담사가 혼자 처리할 수 없다
var 반품배송비 = 5000;      // 단순 변심 반품에만 부과

var 사유표 = {
  change: { 이름: '단순 변심',      판매자귀책: false, 신청기한: 7  },
  defect: { 이름: '상품 하자·불량', 판매자귀책: true,  신청기한: 30 },
  wrong:  { 이름: '오배송',         판매자귀책: true,  신청기한: 30 },
  delay:  { 이름: '배송 지연',      판매자귀책: true,  신청기한: 30 }
};

/* ── 연습용 주문 데이터 4건 ─────────────────────────────────────────
     금액은 여기에만 있다. AI에게 묻지 않고 항상 이 표에서 조회한다.
     50만 원 이하 2건 / 50만 원 초과 2건.
   ─────────────────────────────────────────────────────────────────── */
var 주문목록 = [
  { 주문번호: 'ORD-2609-1042', 상품: '무선 이어폰',     옵션: '화이트 / 1개',
    금액: 189000,  배송상태: '배송완료', 결제수단: '신용카드', 주문경과일: 5,  배송경과일: 3 },

  { 주문번호: 'ORD-2608-0630', 상품: '러닝화 270mm',    옵션: '네이비',
    금액: 89000,   배송상태: '배송완료', 결제수단: '간편결제', 주문경과일: 24, 배송경과일: 21 },

  { 주문번호: 'ORD-2609-1188', 상품: '전자동 커피머신', 옵션: '블랙',
    금액: 620000,  배송상태: '배송중',   결제수단: '계좌이체', 주문경과일: 2,  배송경과일: null },

  { 주문번호: 'ORD-2608-0871', 상품: '14인치 노트북',   옵션: '16GB / 512GB',
    금액: 1450000, 배송상태: '배송완료', 결제수단: '신용카드', 주문경과일: 9,  배송경과일: 6 }
];

function 주문찾기(주문번호) {
  for (var i = 0; i < 주문목록.length; i++) {
    if (주문목록[i].주문번호 === 주문번호) return 주문목록[i];
  }
  return null;
}

function 원(n) { return Number(n).toLocaleString('ko-KR') + '원'; }

/* ══════════════════════════════════════════════════════════════════════
   state ─ 모든 노드가 함께 쓰는 객체 하나.
   노드는 이 값을 채우기만 하고, 다음에 어디로 갈지는 결정하지 않는다.
   ══════════════════════════════════════════════════════════════════════ */
function 새state() {
  return {
    주문번호: null,   // 고객 문장에서 추출
    금액:     null,   // 주문조회 노드가 주문 데이터에서 조회해 채운다
    사유:     null,   // 고객 문장에서 추출
    판정:     null,   // 사람승인 노드에서 담당자가 누르는 값: '승인' | '반려'
    결과:     null    // 각 노드가 남기는 처리 결과
  };
}

var state = 새state();

/* 그래프를 걷는 데 필요한 위치 정보. state와 분리해 둔다. */
var 실행 = { 노드: '주문조회', 지나온엣지: [], 대기: null };

/* ══════════════════════════════════════════════════════════════════════
   노드 5개 ─ 각자 state의 값을 채울 뿐, 분기하지 않는다.
   ══════════════════════════════════════════════════════════════════════ */
var NODES = {
  '주문조회': {
    설명: '주문번호로 주문 데이터를 찾아 결제 금액을 state.금액에 채운다.',
    실행: function (state) {
      var 주문 = 주문찾기(state.주문번호);
      if (!주문) return;                 // 아직 주문번호가 없으면 채울 것이 없다
      state.금액 = 주문.금액;            // ← AI가 아니라 주문 데이터에서 조회
      state.결과 = 주문.상품 + ' (' + 주문.옵션 + ') ' + 원(주문.금액) + ' 조회 완료';
    }
  },

  '금액확인': {
    설명: 'state.금액을 승인 한도(50만 원)와 비교한 사실만 기록한다.',
    실행: function (state) {
      state.결과 = '결제 금액 ' + 원(state.금액) + ' / 상담사 승인 한도 ' + 원(승인한도);
    }
  },

  '사람승인': {
    설명: '상담사 권한 밖의 건. 담당자가 버튼을 누를 때까지 여기서 멈춘다.',
    실행: function (state) {
      state.결과 = state.판정 === null  ? '담당자 판단 대기 중'
                 : state.판정 === '승인' ? '담당자 승인'
                 : '환불 불가 — 담당자 반려';
    }
  },

  '환불처리': {
    설명: '차감 항목을 반영해 환불 금액을 계산하고 접수한다.',
    실행: function (state) {
      var 주문 = 주문찾기(state.주문번호);
      var 사유 = 사유표[state.사유];
      // 흐름 분기가 아니라 금액 계산이다. 배송 전이거나 판매자 귀책이면 배송비를 물리지 않는다.
      var 차감 = (!사유.판매자귀책 && 주문.배송상태 === '배송완료') ? 반품배송비 : 0;
      var 환불액 = Math.max(0, 주문.금액 - 차감);
      state.결과 = 차감
        ? '환불 접수 — ' + 원(주문.금액) + ' − 반품 배송비 ' + 원(차감) + ' = ' + 원(환불액)
        : '환불 접수 — ' + 원(환불액);
    }
  },

  '완료': {
    설명: '상담 결과를 확정한다.',
    실행: function (state) {
      state.결과 = '[확정] ' + state.결과;
    }
  }
};

/* ══════════════════════════════════════════════════════════════════════
   조건 함수 ─ 전부 (state) → boolean. state를 읽기만 한다.
   ══════════════════════════════════════════════════════════════════════ */

function 미확인(state) {
  if (state.주문번호 === null || state.사유 === null) return true;
  return false;
}

function 경과일(state) {
  var 주문 = 주문찾기(state.주문번호);
  if (주문.배송상태 !== '배송완료') return 0;   // 배송 전이면 기한을 다투지 않는다
  return 주문.배송경과일;
}

function 신청기간_이내(state) {
  if (경과일(state) <= 사유표[state.사유].신청기한) return true;
  return false;
}

function 신청기간_초과(state) {
  if (경과일(state) > 사유표[state.사유].신청기한) return true;
  return false;
}

/* ── 50만 원 기준 ────────────────────────────────────────────────────
   AI에게 판단을 맡기지 않는다. 여기서 if 문으로 직접 비교한다.
   비교 대상 state.금액은 주문조회 노드가 주문 데이터에서 조회해 채운 값이다.
   ─────────────────────────────────────────────────────────────────── */
function 금액이_한도_초과(state) {
  if (state.금액 > 승인한도) {   // 50만 원을 넘으면 → 사람승인
    return true;
  }
  return false;
}

function 금액이_한도_이하(state) {
  if (state.금액 <= 승인한도) {  // 50만 원 이하면 → 환불처리
    return true;
  }
  return false;
}

function 판단_대기(state) {
  if (state.판정 === null) return true;
  return false;
}

function 담당자_승인(state) {
  if (state.판정 === '승인') return true;
  return false;
}

function 담당자_반려(state) {
  if (state.판정 === '반려') return true;
  return false;
}

function 항상(state) { return true; }

/* ══════════════════════════════════════════════════════════════════════
   엣지 ─ [ 현재 노드, 조건 이름, 조건 함수, 다음 노드 ]

   앱의 모든 흐름이 여기 있다. 이 배열만 읽으면 전체 동작을 알 수 있다.
   위에서부터 순서대로 확인해, 조건이 처음으로 맞는 줄 하나만 따라간다.
   현재 노드와 다음 노드가 같은 줄은 "제자리" = 입력이 올 때까지 멈춘다.
   ══════════════════════════════════════════════════════════════════════ */
var EDGES = [
  ['주문조회', '주문번호·사유 미확인', 미확인,          '주문조회'],
  ['주문조회', '신청 기간 초과',       신청기간_초과,   '사람승인'],
  ['주문조회', '신청 기간 이내',       신청기간_이내,   '금액확인'],

  ['금액확인', '50만 원 초과',         금액이_한도_초과, '사람승인'],
  ['금액확인', '50만 원 이하',         금액이_한도_이하, '환불처리'],

  ['사람승인', '담당자 판단 대기',     판단_대기,       '사람승인'],
  ['사람승인', '담당자 승인',          담당자_승인,     '환불처리'],
  ['사람승인', '담당자 반려',          담당자_반려,     '완료'],

  ['환불처리', '환불 접수',            항상,            '완료']
];

/* ══════════════════════════════════════════════════════════════════════
   엔진 ─ EDGES를 해석하는 코드는 이 둘이 전부다.
   ══════════════════════════════════════════════════════════════════════ */

/** 현재 노드에서 위에서부터 훑어, 조건이 처음으로 맞는 엣지를 돌려준다. */
function 다음엣지() {
  for (var i = 0; i < EDGES.length; i++) {
    if (EDGES[i][0] === 실행.노드 && EDGES[i][2](state) === true) {
      return { 번호: i, 이름: EDGES[i][1], 다음: EDGES[i][3] };
    }
  }
  return null;
}

/** 멈출 곳까지 그래프를 걷는다. 멈춘 자리(실행.노드)는 그대로 남는다. */
function 이어서실행() {
  실행.대기 = null;
  if (실행.노드 !== '완료') NODES[실행.노드].실행(state);

  for (var 안전장치 = 0; 안전장치 < 100; 안전장치++) {
    var 엣지 = 다음엣지();
    if (엣지 === null) break;                  // 나가는 엣지 없음 = 종착

    if (엣지.다음 === 실행.노드) {             // 제자리 = 여기서 멈추고 입력을 기다린다
      실행.대기 = 엣지.이름;
      break;
    }

    실행.지나온엣지.push(엣지.번호);
    실행.노드 = 엣지.다음;
    NODES[실행.노드].실행(state);
  }
}

function 상담초기화() {
  state = 새state();
  실행 = { 노드: '주문조회', 지나온엣지: [], 대기: null };
}
</script>

<!-- ══════════════════════════════════════════════════════════════════════
     2. 입력 추출 ─ AI는 오직 여기서만 쓴다.
        고객 문장에서 주문번호와 환불 사유만 뽑는다.
        금액·승인 여부처럼 판단이 필요한 값은 절대 묻지 않는다.
        API 키가 없으면 정규식으로 대신 뽑는다.
     ══════════════════════════════════════════════════════════════════════ -->
<script>
'use strict';

var MODEL = 'claude-opus-5';

function API키() {
  try { return localStorage.getItem('ANTHROPIC_API_KEY') || ''; } catch (e) { return ''; }
}
function API키저장(값) {
  try { 값 ? localStorage.setItem('ANTHROPIC_API_KEY', 값)
           : localStorage.removeItem('ANTHROPIC_API_KEY'); } catch (e) {}
}

/* ── 정규식 추출 (키 없을 때의 기본 경로) ───────────────────────── */
var 사유규칙 = [
  ['defect', /하자|불량|고장|파손|깨졌|깨진|망가|찢어|작동이? ?안|안 ?켜|안 ?들어와|안 ?나와|안 ?들려|안 ?열려|이상해|이상하/],
  ['wrong',  /오배송|다른 ?(상품|물건|색|사이즈|제품)|잘못 ?(왔|보냈|배송|옴)|엉뚱/],
  ['delay',  /지연|늦게|늦어|안 ?와|안 ?오|아직도? ?안|배송이 ?안|언제 ?와/],
  ['change', /변심|마음이 ?바뀌|마음에 ?안 ?들|필요 ?없|안 ?쓸|안 ?맞|사이즈가|색상이|그냥 ?(환불|반품|취소)|반품|환불|취소/]
];

function 정규식으로추출(문장) {
  var 뽑음 = { 주문번호: null, 사유: null };

  var 압축 = 문장.toUpperCase().replace(/[\s\-_.]/g, '');
  /* 뒤 네 자리는 숫자 덩어리 단위로 견준다.
     문자열 안에서 찾으면 "10420원" 같은 다른 숫자의 일부까지 주문번호로 잡힌다. */
  var 숫자덩이 = 문장.match(/\d+/g) || [];

  for (var i = 0; i < 주문목록.length; i++) {
    var id = 주문목록[i].주문번호.toUpperCase().replace(/-/g, '');   // ORD26091042
    var 뒤4 = id.slice(-4);                                          // 1042
    if (압축.indexOf(id) >= 0 || 숫자덩이.indexOf(뒤4) >= 0) {
      뽑음.주문번호 = 주문목록[i].주문번호;
      break;
    }
  }

  for (var j = 0; j < 사유규칙.length; j++) {
    if (사유규칙[j][1].test(문장)) { 뽑음.사유 = 사유규칙[j][0]; break; }
  }
  return 뽑음;
}

/* ── Claude API 추출 (키가 있을 때) ──────────────────────────────── */
var 추출스키마 = {
  type: 'object',
  properties: {
    주문번호: { type: 'string', description: '문장에 없으면 빈 문자열' },
    사유:     { type: 'string', enum: ['change', 'defect', 'wrong', 'delay', ''] }
  },
  required: ['주문번호', '사유'],
  additionalProperties: false
};

function AI로추출(문장, 키) {
  var 목록 = 주문목록.map(function (o) { return o.주문번호 + ' (' + o.상품 + ')'; }).join(', ');

  return fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': 키,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: MODEL,
      max_tokens: 1024,
      output_config: {
        effort: 'low',
        format: { type: 'json_schema', schema: 추출스키마 }
      },
      system:
        '고객 문장에서 주문번호와 환불 사유만 뽑아내라. 그 외에는 아무것도 판단하지 마라.\n' +
        '주문번호 후보: ' + 목록 + '\n' +
        '사유 코드: change(단순 변심), defect(상품 하자·불량), wrong(오배송), delay(배송 지연).\n' +
        '문장에 없는 값은 빈 문자열로 두어라. 금액이나 승인 여부는 절대 추측하지 마라.',
      messages: [{ role: 'user', content: 문장 }]
    })
  }).then(function (res) {
    if (!res.ok) throw new Error('API ' + res.status);
    return res.json();
  }).then(function (data) {
    var 텍스트 = '';
    (data.content || []).forEach(function (b) { if (b.type === 'text') 텍스트 += b.text; });
    return JSON.parse(텍스트);
  });
}

/* ── 추출 결과는 반드시 주문 데이터로 검증한다 ──────────────────── */
function 검증(뽑음) {
  return {
    주문번호: 주문찾기(뽑음.주문번호) ? 뽑음.주문번호 : null,
    사유: 사유표[뽑음.사유] ? 뽑음.사유 : null
  };
}

/** 문장 → { 주문번호, 사유, 방식 } */
function 문장에서추출(문장) {
  var 키 = API키();
  if (!키) {
    return Promise.resolve(Object.assign(검증(정규식으로추출(문장)), { 방식: '정규식' }));
  }
  return AI로추출(문장, 키)
    .then(function (r) { return Object.assign(검증(r), { 방식: 'Claude API' }); })
    .catch(function (e) {
      console.warn('AI 추출 실패, 정규식으로 대체합니다:', e.message);
      return Object.assign(검증(정규식으로추출(문장)), { 방식: '정규식 (API 실패)' });
    });
}
</script>

<!-- ══════════════════════════════════════════════════════════════════════
     3. 화면 ─ state와 실행 위치를 그리기만 한다. 흐름 판단은 하지 않는다.
     ══════════════════════════════════════════════════════════════════════ -->
<script>
'use strict';

var 대화 = [];

function 이스케이프(t) {
  return String(t).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function 말하기(누가, 내용) { 대화.push({ 누가: 누가, 내용: 내용 }); }

/* ── 노드 좌표 ─────────────────────────────────────────────────── */
var 좌표 = {
  '주문조회': { x: 70,  y: 72 },
  '금액확인': { x: 225, y: 72 },
  '환불처리': { x: 420, y: 72 },
  '완료':     { x: 570, y: 72 },
  '사람승인': { x: 310, y: 210 }
};

/* ══════════════════════════════════════════════════════════════════
   엣지 그림을 EDGES와 좌표에서 계산한다.

   손으로 적어 둔 path 배열이 없다. EDGES에 줄을 추가하면 선과 라벨이
   따라 나오므로, 노드를 늘릴 때 좌표만 넣으면 된다.
   ══════════════════════════════════════════════════════════════════ */
var 박스 = { 폭: 94, 높이: 36 };
var 화면 = { 폭: 640, 높이: 300 };

function 사이(값, 최소, 최대) { return Math.max(최소, Math.min(최대, 값)); }

/** 두 노드를 잇는다면 서로 어느 면으로 드나들지 */
function 면정하기(a, b) {
  var dx = b.x - a.x, dy = b.y - a.y;
  if (Math.abs(dx) >= Math.abs(dy)) return dx >= 0 ? ['오른', '왼'] : ['왼', '오른'];
  return dy >= 0 ? ['아래', '위'] : ['위', '아래'];
}

/** 노드 테두리에서 선이 붙는 점. 상대 노드 쪽으로 조금 치우쳐 서로 겹치지 않게 한다. */
function 붙는점(이쪽, 면, 저쪽) {
  var p = 좌표[이쪽], q = 좌표[저쪽];
  if (면 === '위' || 면 === '아래') {
    return { x: p.x + 사이((q.x - p.x) * 0.25, -33, 33),
             y: p.y + (면 === '위' ? -박스.높이 / 2 : 박스.높이 / 2) };
  }
  return { x: p.x + (면 === '왼' ? -박스.폭 / 2 : 박스.폭 / 2),
           y: p.y + 사이((q.y - p.y) * 0.06, -9, 9) };
}

/** 3차 베지어 위의 한 점 */
function 곡선점(P, t) {
  var u = 1 - t;
  return {
    x: u*u*u*P[0].x + 3*u*u*t*P[1].x + 3*u*t*t*P[2].x + t*t*t*P[3].x,
    y: u*u*u*P[0].y + 3*u*u*t*P[1].y + 3*u*t*t*P[2].y + t*t*t*P[3].y
  };
}

/** 엣지 하나의 곡선과 라벨 위치 */
function 엣지그림(from, to) {
  var P;

  if (from === to) {                       /* 제자리 — 노드 위나 아래로 고리를 그린다 */
    var p = 좌표[from], 위쪽 = p.y < 화면.높이 / 2;
    var y = p.y + (위쪽 ? -박스.높이 / 2 : 박스.높이 / 2);
    var h = 위쪽 ? -38 : 38;
    P = [{ x: p.x - 24, y: y }, { x: p.x - 34, y: y + h },
         { x: p.x + 34, y: y + h }, { x: p.x + 24, y: y }];
  } else {
    var 면 = 면정하기(좌표[from], 좌표[to]);
    var a = 붙는점(from, 면[0], to);
    var b = 붙는점(to, 면[1], from);
    if (면[0] === '왼' || 면[0] === '오른') {       /* 가로로 나가면 가로로 휜다 */
      var kx = (b.x - a.x) * 0.5;
      P = [a, { x: a.x + kx, y: a.y }, { x: b.x - kx, y: b.y }, b];
    } else {                                        /* 세로로 나가면 세로로 휜다 */
      var ky = (b.y - a.y) * 0.5;
      P = [a, { x: a.x, y: a.y + ky }, { x: b.x, y: b.y - ky }, b];
    }
  }

  /* 라벨은 곡선 한가운데에서 화면 바깥쪽으로 밀어 선 위에 겹치지 않게 한다 */
  var 가운데 = 곡선점(P, 0.5);
  var 앞 = 곡선점(P, 0.46), 뒤 = 곡선점(P, 0.54);
  var dx = 뒤.x - 앞.x, dy = 뒤.y - 앞.y;
  var 길이 = Math.sqrt(dx*dx + dy*dy) || 1;
  var 수직 = { x: -dy / 길이, y: dx / 길이 };
  var 바깥 = { x: 가운데.x - 화면.폭 / 2, y: 가운데.y - 화면.높이 / 2 };
  if (수직.x * 바깥.x + 수직.y * 바깥.y < 0) { 수직.x *= -1; 수직.y *= -1; }

  return {
    d: 'M ' + P[0].x.toFixed(1) + ',' + P[0].y.toFixed(1) +
       ' C ' + P[1].x.toFixed(1) + ',' + P[1].y.toFixed(1) +
       ' '   + P[2].x.toFixed(1) + ',' + P[2].y.toFixed(1) +
       ' '   + P[3].x.toFixed(1) + ',' + P[3].y.toFixed(1),
    가운데: 가운데,
    수직: 수직
  };
}

/** 조건 이름이 길면 가운데 빈칸에서 두 줄로 접는다 */
function 라벨줄(이름) {
  if (이름.length <= 9) return [이름];
  var 빈칸 = [];
  for (var i = 0; i < 이름.length; i++) if (이름.charAt(i) === ' ') 빈칸.push(i);
  if (!빈칸.length) return [이름];
  var 가운데 = 이름.length / 2, 최선 = 빈칸[0];
  빈칸.forEach(function (p) {
    if (Math.abs(p - 가운데) < Math.abs(최선 - 가운데)) 최선 = p;
  });
  return [이름.slice(0, 최선), 이름.slice(최선 + 1)];
}

function 그래프그리기() {
  var 지남 = {};
  실행.지나온엣지.forEach(function (i) { 지남[i] = true; });

  var 방문노드 = { '주문조회': true };
  실행.지나온엣지.forEach(function (i) { 방문노드[EDGES[i][3]] = true; });

  /* 지금 기다리는 제자리 엣지 번호 */
  var 대기엣지 = -1;
  if (실행.대기 !== null) {
    for (var i = 0; i < EDGES.length; i++) {
      if (EDGES[i][0] === 실행.노드 && EDGES[i][1] === 실행.대기) { 대기엣지 = i; break; }
    }
  }

  var e = '';
  EDGES.forEach(function (엣지, i) {
    var 모양 = 엣지그림(엣지[0], 엣지[3]);
    var cls = 지남[i] ? ' on' : (i === 대기엣지 ? ' wait' : '');
    /* 제자리 엣지는 노드 위아래로 가로 공간이 넉넉하니 접지 않는다 */
    var 줄 = (엣지[0] === 엣지[3]) ? [엣지[1]] : 라벨줄(엣지[1]);

    /* 곡선에서 밀어낼 거리. 가로로 밀 때는 글자 너비를, 세로로 밀 때는 줄 수를 본다. */
    var 거리 = 9 + Math.abs(모양.수직.x) * Math.min(엣지[1].length * 4.6, 30)
                 + Math.abs(모양.수직.y) * 줄.length * 9;
    var lx = 사이(모양.가운데.x + 모양.수직.x * 거리, 24, 화면.폭 - 24);
    var ly = 사이(모양.가운데.y + 모양.수직.y * 거리 - (줄.length - 1) * 5.5, 11, 화면.높이 - 4);

    e += '<path class="edge' + cls + '" d="' + 모양.d + '"></path>';
    e += '<text class="elabel' + cls + '" x="' + lx.toFixed(1) + '" y="' + ly.toFixed(1) + '">' +
         줄.map(function (s, k) {
           return '<tspan x="' + lx.toFixed(1) + '" dy="' + (k ? 11 : 0) + '">' + s + '</tspan>';
         }).join('') +
         '</text>';
  });
  document.getElementById('gEdges').innerHTML = e;

  var n = '';
  Object.keys(좌표).forEach(function (이름) {
    var p = 좌표[이름];
    /* 멈춰서 기다리는 자리는 주황. 사람이 버튼을 눌러야 하는 자리만 깜빡인다. */
    var cls = 이름 === 실행.노드
      ? (실행.대기 ? (이름 === '사람승인' ? 'wait blink' : 'wait') : 'current')
      : (방문노드[이름] ? 'done' : 'idle');
    n += '<rect class="nbox ' + cls + '" x="' + (p.x - 47) + '" y="' + (p.y - 18) +
         '" width="94" height="36" rx="9"></rect>' +
         '<text class="ntext ' + cls + '" x="' + p.x + '" y="' + (p.y + 1) + '">' + 이름 + '</text>';
  });
  document.getElementById('gNodes').innerHTML = n;
}

/* ── 주문 데이터에서 가져오는 안내 문구 ─────────────────────────
   흐름 판단이 아니라 고객에게 읽어 줄 문장이다.
   ─────────────────────────────────────────────────────────────── */
function 날짜(경과일) {
  if (경과일 === null || 경과일 === undefined) return '-';
  var d = new Date();
  d.setDate(d.getDate() - 경과일);
  return d.getFullYear() + '.' +
         String(d.getMonth() + 1).padStart(2, '0') + '.' +
         String(d.getDate()).padStart(2, '0');
}

function 환불소요일(결제수단) {
  if (결제수단 === '신용카드') return '신용카드 결제라 카드사 승인 취소까지 영업일 기준 3~5일이 걸립니다.';
  if (결제수단 === '계좌이체') return '계좌이체 결제라 등록된 계좌로 영업일 기준 2일 이내 입금됩니다.';
  return '간편결제 수단이라 영업일 기준 2~3일 이내 환불됩니다.';
}

/** 완료 노드에서 고객에게 안내할 처리 절차 */
function 처리안내() {
  var 주문 = 주문찾기(state.주문번호);
  if (!주문) return [];

  if (state.판정 === '반려') {
    return ['· 대체 방안(수리·교환·부분 보상)을 함께 안내해 주세요.',
            '· 예외 승인이 필요하면 상담 메모를 남기고 담당자에게 이관하세요.'];
  }

  var 줄 = [];
  if (주문.배송상태 === '배송완료') {
    줄.push('· 택배 회수를 예약하고, 상품을 원래 포장 그대로 준비하도록 안내하세요.');
    줄.push('· 입고 및 검수(1~2일)가 끝나면 환불이 진행됩니다.');
  } else {
    줄.push('· 배송 완료 전이라 반품이 아닌 주문 취소로 처리됩니다.');
    줄.push('· 이미 출고된 상품이므로 회수가 끝난 뒤 환불이 시작됩니다.');
  }
  줄.push('· ' + 환불소요일(주문.결제수단));
  return 줄;
}

/* ── 조회한 주문 ───────────────────────────────────────────────── */
function 주문정보그리기() {
  var el = document.getElementById('orderInfo');
  var 주문 = 주문찾기(state.주문번호);
  if (!주문) {
    el.innerHTML = '<p class="none">아직 조회된 주문이 없습니다.</p>';
    return;
  }
  function 행(k, v) { return '<tr><th>' + k + '</th><td>' + v + '</td></tr>'; }
  el.innerHTML = '<table class="state">' +
    행('상품', 주문.상품 + ' (' + 주문.옵션 + ')') +
    행('결제', 원(주문.금액) + ' · ' + 주문.결제수단) +
    행('주문일', 날짜(주문.주문경과일) + ' · ' + 주문.주문경과일 + '일 경과') +
    행('배송', 주문.배송상태 + (주문.배송경과일 === null ? ''
        : ' · ' + 날짜(주문.배송경과일) + ' · ' + 주문.배송경과일 + '일 경과')) +
    '</table>';
}

/* ── 환불 정책 (정책 상수에서 그대로 만든다) ───────────────────── */
function 정책그리기() {
  var 기한 = Object.keys(사유표).map(function (k) {
    return 사유표[k].이름 + ' ' + 사유표[k].신청기한 + '일';
  }).join(' · ');

  document.getElementById('policy').innerHTML =
    '<ul class="policy">' +
    '<li>결제 금액이 <b>' + 원(승인한도) + '</b>을 넘으면 상담사가 즉시 승인할 수 없고 담당자 검토를 거칩니다.</li>' +
    '<li>단순 변심 반품에는 반품 배송비 <b>' + 원(반품배송비) + '</b>이 차감됩니다. 판매자 귀책이면 차감이 없습니다.</li>' +
    '<li>배송 완료 후 신청 기한 — ' + 기한 + '</li>' +
    '<li>배송 완료 전이면 반품이 아닌 <b>주문 취소</b>로 처리되어 배송비 차감이 없습니다.</li>' +
    '</ul>';
}

/* ── state 표 ──────────────────────────────────────────────────── */
function state그리기() {
  function 칸(id, 값) {
    var el = document.getElementById('s-' + id);
    el.innerHTML = (값 === null || 값 === undefined)
      ? '<span class="null">null</span>' : 이스케이프(값);
  }
  칸('주문번호', state.주문번호);
  칸('금액', state.금액 === null ? null : 원(state.금액));
  칸('사유', state.사유 === null ? null : 사유표[state.사유].이름 + ' (' + state.사유 + ')');
  칸('판정', state.판정);
  칸('결과', state.결과);
}

/* ── EDGES 표 ──────────────────────────────────────────────────── */
function 표그리기() {
  var 지남 = {};
  실행.지나온엣지.forEach(function (i) { 지남[i] = true; });

  var html = '';
  EDGES.forEach(function (e, i) {
    var 대기중 = (실행.대기 !== null && e[0] === 실행.노드 && e[1] === 실행.대기);
    var cls = 지남[i] ? 'on' : (대기중 ? 'wait' : '');
    var 다음 = (e[3] === e[0]) ? '<span class="self">' + e[3] + ' (제자리)</span>' : e[3];
    html += '<tr class="' + cls + '"><td class="num">' + i + '</td><td>' + e[0] + '</td><td>' +
            e[1] + '</td><td class="fn">' + e[2].name + '</td><td>' + 다음 + '</td></tr>';
  });
  document.getElementById('gBody').innerHTML = html;
}

/* ── 채팅 ──────────────────────────────────────────────────────── */
function 채팅그리기() {
  var box = document.getElementById('messages');
  box.innerHTML = 대화.map(function (m) {
    return '<div class="msg ' + m.누가 + '">' + 이스케이프(m.내용) + '</div>';
  }).join('');
  box.scrollTop = box.scrollHeight;

  /* 사람승인에서 멈춰 있을 때만 승인/거절 버튼을 낸다 */
  var 승인칸 = document.getElementById('approve');
  if (실행.노드 === '사람승인' && 실행.대기 !== null) {
    승인칸.innerHTML =
      '<button class="ok" id="btnOk">승인</button>' +
      '<button class="no" id="btnNo">거절</button>';
    document.getElementById('btnOk').onclick = function () { 담당자판단('승인'); };
    document.getElementById('btnNo').onclick = function () { 담당자판단('반려'); };
  } else {
    승인칸.innerHTML = '';
  }

  document.getElementById('send').disabled = (실행.노드 === '완료');
  document.getElementById('mode').textContent =
    'AI 사용 범위: 고객 문장에서 주문번호·사유 추출만. 현재 추출 방식: ' +
    (API키() ? 'Claude API (' + MODEL + ')' : '정규식 (API 키 없음)');
}

function 전체그리기() {
  채팅그리기(); 그래프그리기(); state그리기(); 주문정보그리기(); 표그리기();
}

/* ── 멈춘 자리에 맞춰 안내 문장을 고른다 ───────────────────────── */
function 안내() {
  if (실행.노드 === '완료') {
    말하기('bot', [state.결과].concat(처리안내()).join('\n'));
    return;
  }

  if (실행.노드 === '사람승인' && 실행.대기 !== null) {
    var 직전 = 실행.지나온엣지[실행.지나온엣지.length - 1];
    말하기('bot',
      '「' + EDGES[직전][1] + '」 이라서 담당자 확인이 필요합니다.\n' +
      '사람승인 노드에서 멈췄습니다. 아래 승인 / 거절 버튼을 눌러 주세요.');
    return;
  }

  if (실행.노드 === '주문조회') {
    var 빠진 = [];
    if (state.주문번호 === null) 빠진.push('주문번호');
    if (state.사유 === null) 빠진.push('환불 사유');
    말하기('bot', 빠진.join('와 ') + '를 알려 주시겠어요?');
  }
}

/* ── 고객 문장 처리 ────────────────────────────────────────────── */
function 보내기() {
  var el = document.getElementById('text');
  var 문장 = el.value.trim();
  if (!문장 || 실행.노드 === '완료') return;

  말하기('user', 문장);
  el.value = '';
  전체그리기();

  문장에서추출(문장).then(function (뽑음) {
    /* AI(또는 정규식)가 뽑은 건 주문번호와 사유뿐이다. 나머지는 그래프가 판단한다. */
    if (뽑음.주문번호) state.주문번호 = 뽑음.주문번호;
    if (뽑음.사유) state.사유 = 뽑음.사유;

    var 읽음 = [];
    if (뽑음.주문번호) 읽음.push('주문번호 ' + 뽑음.주문번호);
    if (뽑음.사유) 읽음.push('사유 ' + 사유표[뽑음.사유].이름);
    말하기('sys', '[' + 뽑음.방식 + ' 추출] ' + (읽음.length ? 읽음.join(' · ') : '읽어낸 값 없음'));

    이어서실행();
    안내();
    전체그리기();
  });
}

/* ── 담당자 버튼: 멈춰 있던 자리에서 이어서 실행 ───────────────── */
function 담당자판단(값) {
  state.판정 = 값;
  말하기('sys', '담당자 ' + (값 === '승인' ? '승인' : '거절') + ' — 사람승인 노드에서 이어서 실행합니다.');
  이어서실행();          // 실행.노드는 여전히 '사람승인'. 거기서부터 계속된다.
  안내();
  전체그리기();
}

/* ── 초기화 ────────────────────────────────────────────────────── */
function 새상담() {
  상담초기화();
  대화 = [];
  말하기('bot', '안녕하세요, 환불 상담입니다. 주문번호와 환불 사유를 말씀해 주세요.');
  document.getElementById('text').value = '';
  이어서실행();
  전체그리기();
}

/* ── 예시 문장 ─────────────────────────────────────────────────── */
var 예시 = [
  '1042번 이어폰 그냥 마음이 바뀌어서 환불할게요',
  'ORD-2608-0871 노트북이 불량이에요',
  '1188 커피머신 취소하고 싶어요',
  '0630 러닝화 색상이 마음에 안 들어요'
];
document.getElementById('chips').innerHTML = 예시.map(function (t, i) {
  return '<button class="chip" data-i="' + i + '">' + 이스케이프(t) + '</button>';
}).join('');
document.getElementById('chips').addEventListener('click', function (ev) {
  var b = ev.target.closest('.chip');
  if (!b) return;
  document.getElementById('text').value = 예시[Number(b.dataset.i)];
  보내기();
});

document.getElementById('send').addEventListener('click', 보내기);
document.getElementById('reset').addEventListener('click', 새상담);
document.getElementById('text').addEventListener('keydown', function (ev) {
  if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); 보내기(); }
});
정책그리기();
document.getElementById('key').value = API키();
document.getElementById('saveKey').addEventListener('click', function () {
  API키저장(document.getElementById('key').value.trim());
  채팅그리기();
});

새상담();
</script>
</body>
</html>
